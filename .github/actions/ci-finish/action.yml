name: ci-finish
description: Give a CI run one verdict and one summary, and mark the tree after a full run.

# Runs as the last job under `if: always()`. Its needs must include each job that can run before the
# verdict. A full run requires every other API job to have completed with success or an exact-name skip
# exception. A full re-run must account for every job name from attempt one. An incomplete audit fails a full run. A partial run adds only established failures to the
# needs verdict, including failures read before an API error. Only a full passing run whose audit and
# summary completed and whose tree is readable uploads ci-passed-full-TREE. A full run with a failed job in needs uploads
# ci-failed-full-TREE. The calling job checks the repository out and grants `actions: read`.

inputs:
  needs:
    description: The calling job's toJSON(needs)
    required: true
  allow-skipped:
    description: >-
      Only IDs of direct jobs in needs that may skip on partial runs. IDs match [A-Za-z_][A-Za-z0-9_-]*.
      Separate them with spaces or commas, or use a JSON array of IDs. This list applies only to needs.
      A listed job that skips on a full run fails the verdict.
    required: false
    default: ''
  allow-skipped-always:
    description: >-
      Only jobs that do not test. Use space- or comma-separated IDs matching [A-Za-z_][A-Za-z0-9_-]*,
      or a JSON array of strings. Use direct IDs for needs and exact API names for the full-run audit.
      A nested job needs its exact API name, including the caller prefix.
    required: false
    default: ''
  full:
    description: >-
      true for a full run, false for a partial run. Any other value fails. Full runs require the runner's
      check run ID to match the finishing job's API row. Without that match, a partial run ignores
      unfinished rows and still counts completed failures and the needs verdict.
    required: true
  segments:
    description: The JSON list of segments ci-scope selected, used to explain skipped test segments
    required: false
    default: ''
  scope-reason:
    description: The reason ci-scope gave, shown on the Scope row
    required: false
    default: ''
  title:
    description: Summary heading, empty for the repository's name followed by CI
    required: false
    default: ''
  job-name:
    description: >-
      Legacy input accepted for compatibility. The action identifies its job by check run ID.
    required: false
    default: CI passed
  token:
    description: Token that can read the run's jobs and the repository's artifacts
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - id: finish
      shell: bash
      env:
        CI_FINISH_NEEDS: ${{ inputs.needs }}
        CI_FINISH_ALLOW_SKIPPED: ${{ inputs.allow-skipped }}
        CI_FINISH_ALLOW_SKIPPED_ALWAYS: ${{ inputs.allow-skipped-always }}
        CI_FINISH_FULL: ${{ inputs.full }}
        CI_FINISH_SEGMENTS: ${{ inputs.segments }}
        CI_FINISH_SCOPE_REASON: ${{ inputs.scope-reason }}
        CI_FINISH_TITLE: ${{ inputs.title }}
        CI_FINISH_CHECK_RUN_ID: ${{ job.check_run_id }}
        CI_API_TOKEN: ${{ inputs.token }}
      run: python3 "$GITHUB_ACTION_PATH/finish.py"
    - if: steps.finish.outputs.upload == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.finish.outputs.artifact }}
        path: ${{ steps.finish.outputs.marker }}
        overwrite: true
        retention-days: 30
        if-no-files-found: error
    - shell: bash
      env:
        CI_FINISH_PASSED: ${{ steps.finish.outputs.passed }}
      run: |
        if [ "$CI_FINISH_PASSED" != true ]; then
          echo "::error::CI did not pass. The run summary lists each stage."
          exit 1
        fi
