name: ci-finish
description: Give a CI run one verdict and one summary, and mark the tree after a full run.

# Runs as the last job of a run, under `needs` for every other job and `if: always()`. The verdict starts
# from `needs`: a failed or cancelled job fails the run. A skipped job fails it unless its id is in
# `allow-skipped-always`, or in `allow-skipped` on a run that is not full, since a full run runs every
# segment. The jobs API can then only turn a pass into a fail: a finished job of this run that failed, timed
# out or was cancelled and that `needs` does not report fails the run. So a job allowed to fail does not
# belong in the workflow whose verdict this is. An API error leaves the verdict from `needs` unchanged and
# only thins the summary. The steps run in order: write the summary, upload the marker, then fail when the
# run did not pass, so a failed run still shows its summary. A full run that passed uploads
# ci-passed-full-TREE. A full run with a job in `needs` that failed uploads ci-failed-full-TREE, so
# ci-tested-tree does not reuse an older pass of that tree. The calling job checks the repository out and
# grants `actions: read`.

inputs:
  needs:
    description: The calling job's toJSON(needs)
    required: true
  allow-skipped:
    description: >-
      Job ids that may be skipped because their segment was not selected, separated by spaces or commas.
      A skip of one of them fails a full run.
    required: false
    default: ''
  allow-skipped-always:
    description: >-
      Job ids that may be skipped on any run, separated by spaces or commas, for a job that does not test,
      such as a deploy that runs only on the default branch
    required: false
    default: ''
  full:
    description: true when ci-scope made this a full run, so every segment job must run and the tree is marked
    required: false
    default: 'false'
  segments:
    description: The JSON list of segments ci-scope selected, used to explain skipped test segments
    required: false
    default: ''
  scope-reason:
    description: The reason ci-scope gave, shown on the Scope row
    required: false
    default: ''
  title:
    description: Summary heading, empty for the repository's name followed by CI
    required: false
    default: ''
  job-name:
    description: Display name of the job that runs this action, so its row is the verdict and comes last
    required: false
    default: CI passed
  token:
    description: Token that can read the run's jobs and the repository's artifacts
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - id: finish
      shell: bash
      env:
        CI_FINISH_NEEDS: ${{ inputs.needs }}
        CI_FINISH_ALLOW_SKIPPED: ${{ inputs.allow-skipped }}
        CI_FINISH_ALLOW_SKIPPED_ALWAYS: ${{ inputs.allow-skipped-always }}
        CI_FINISH_FULL: ${{ inputs.full }}
        CI_FINISH_SEGMENTS: ${{ inputs.segments }}
        CI_FINISH_SCOPE_REASON: ${{ inputs.scope-reason }}
        CI_FINISH_TITLE: ${{ inputs.title }}
        CI_FINISH_JOB_NAME: ${{ inputs.job-name }}
        CI_API_TOKEN: ${{ inputs.token }}
      run: python3 "$GITHUB_ACTION_PATH/finish.py"
    - if: steps.finish.outputs.upload == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.finish.outputs.artifact }}
        path: ${{ steps.finish.outputs.marker }}
        overwrite: true
        retention-days: 30
        if-no-files-found: error
    - shell: bash
      env:
        CI_FINISH_PASSED: ${{ steps.finish.outputs.passed }}
      run: |
        if [ "$CI_FINISH_PASSED" != true ]; then
          echo "::error::CI did not pass. The run summary lists each stage."
          exit 1
        fi
