name: check-actions

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: 'Test: actions'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pin check reads every workflow and action, so a change to an action alone is still checked.
      - name: Pinned
        run: sh scripts/check-workflows.sh
      - name: Every action parses
        run: find .github/actions -type f \( -name action.yml -o -name action.yaml \) -print0 | xargs -0 -n 1 python3 -c "import sys,yaml; yaml.safe_load(open(sys.argv[1]))"
      - name: Python action tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_ci_*.py' -v

  optional-report:
    # A real skipped API job in a reusable workflow, with no test work to excuse.
    name: Optional report
    if: ${{ false }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - run: echo "Optional report"
