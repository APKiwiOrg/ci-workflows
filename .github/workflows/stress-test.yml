name: stress-test

# THE shared stress workflow for every APKiwiOrg repository. A repository calls it from a small caller of its own
# (see README.md), so there is one implementation, and every run happens on a GitHub-hosted runner in the
# CALLER's Actions, checking out the caller's ref. Nothing ever runs on the dev Mac or the self-hosted fleet,
# which is the dev Mac.
#
# A load or stress run needs the owner's explicit permission before it starts (shared rule
# no-local-stress-load). Ask first, then dispatch the caller:
#
#   gh workflow run stress-test.yml --ref <branch> \
#     -f project=<Tests project>.csproj -f filter="FullyQualifiedName~<Name>" -f iterations=50 -f load=4
#
# Inputs reach the scripts only through env, never by expression interpolation into a run line, so a filter
# holding shell metacharacters cannot inject a command.

on:
  workflow_call:
    inputs:
      project:
        description: Test project to build and run (path to its .csproj)
        required: true
        type: string
      filter:
        description: dotnet test --filter expression selecting the tests to repeat
        required: true
        type: string
      iterations:
        description: How many times to run the selection, 1 to 200
        required: false
        default: '20'
        type: string
      load:
        description: Busy-loop processes kept running during every run to add contention, 0 to 16 (0 is none)
        required: false
        default: '0'
        type: string
      build-target:
        description: Solution or project to build before the runs. Empty builds the caller's single root .slnx or .sln, else the test project
        required: false
        default: ''
        type: string
      configuration:
        description: Build configuration, Release or Debug
        required: false
        default: Release
        type: string
      support-cost:
        description: Record one fixed-compilation support-cost artifact per iteration, requires Release and no load
        required: false
        default: false
        type: boolean
      artifact-env:
        description: Environment variable each run gets naming its own retained directory, empty for none
        required: false
        default: ''
        type: string
      coverage-perf-cpu:
        description: Opt in to one separately approved native Vulkan coverage CPU measurement on lavapipe
        required: false
        default: false
        type: boolean
      coverage-perf-unit:
        description: Exact approved coverage performance unit ID, 1 to 64 lowercase letters, digits or hyphens
        required: false
        default: ''
        type: string
      coverage-perf-manifest-sha256:
        description: SHA-256 of the exact approved manifest bytes, 64 lowercase hex characters
        required: false
        default: ''
        type: string
      coverage-perf-workload-sha:
        description: Exact approved workload commit SHA, 40 lowercase hex characters
        required: false
        default: ''
        type: string
      coverage-perf-preset:
        description: Approved CPU preset, C0 smoke or C1 proof
        required: false
        default: ''
        type: string
    secrets:
      packages-token:
        description: Token for a caller whose nuget.config restores from GitHub Packages (the engine passes GITHUB_TOKEN)
        required: false

permissions:
  contents: read

# One stress run per ref at a time. A second dispatch on the same branch queues rather than cancelling the
# first, because a half-finished proof is worth nothing.
concurrency:
  group: stress-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stress:
    # GitHub-hosted on purpose, never [self-hosted]: the self-hosted fleet is the dev Mac.
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ inputs.coverage-perf-cpu && (inputs.coverage-perf-preset == 'C0' && 20 || 30) || 90 }}
    env:
      GITHUB_PACKAGES_PAT: ${{ secrets.packages-token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keep the existing route's setup order. Coverage requests, including stray structured inputs when
      # the switch is off, are refused before any install or build. No caller filter reaches this mode.
      - name: Check coverage performance inputs
        if: inputs.coverage-perf-cpu || inputs.coverage-perf-unit != '' || inputs.coverage-perf-manifest-sha256 != '' || inputs.coverage-perf-workload-sha != '' || inputs.coverage-perf-preset != ''
        env:
          PROJECT: ${{ inputs.project }}
          BUILD_TARGET: ${{ inputs.build-target }}
          CONFIGURATION: ${{ inputs.configuration }}
          LOAD: ${{ inputs.load }}
          ITERATIONS: ${{ inputs.iterations }}
          SUPPORT_COST: ${{ inputs.support-cost }}
          FILTER: ${{ inputs.filter }}
          ARTIFACT_ENV: ${{ inputs.artifact-env }}
          COVERAGE_PERF_CPU: ${{ inputs.coverage-perf-cpu }}
          COVERAGE_PERF_UNIT: ${{ inputs.coverage-perf-unit }}
          COVERAGE_PERF_MANIFEST_SHA256: ${{ inputs.coverage-perf-manifest-sha256 }}
          COVERAGE_PERF_WORKLOAD_SHA: ${{ inputs.coverage-perf-workload-sha }}
          COVERAGE_PERF_PRESET: ${{ inputs.coverage-perf-preset }}
          LC_ALL: C
        run: |
          if [ "$COVERAGE_PERF_CPU" != true ]; then
            if [ -n "$COVERAGE_PERF_UNIT$COVERAGE_PERF_MANIFEST_SHA256$COVERAGE_PERF_WORKLOAD_SHA$COVERAGE_PERF_PRESET" ]; then
              echo "::error::coverage-perf-unit, coverage-perf-manifest-sha256, coverage-perf-workload-sha and coverage-perf-preset must be empty when coverage-perf-cpu is false"
              exit 1
            fi
            exit 0
          fi
          perf_project=tools/EquipmentCoverage.Perf.Tests/EquipmentCoverage.Perf.Tests.csproj
          if [ "$PROJECT" != "$perf_project" ]; then
            echo "::error::coverage-perf-cpu project must be tools/EquipmentCoverage.Perf.Tests/EquipmentCoverage.Perf.Tests.csproj"; exit 1
          fi
          if [ -n "$BUILD_TARGET" ] && [ "$BUILD_TARGET" != "$perf_project" ]; then
            echo "::error::coverage-perf-cpu build-target must be empty or the exact Perf project path"; exit 1
          fi
          if [ "$CONFIGURATION" != Release ]; then echo "::error::coverage-perf-cpu configuration must be Release"; exit 1; fi
          if [ "$LOAD" != 0 ]; then echo "::error::coverage-perf-cpu load must be 0"; exit 1; fi
          if [ "$ITERATIONS" != 1 ]; then echo "::error::coverage-perf-cpu iterations must be 1"; exit 1; fi
          if [ "$SUPPORT_COST" != false ]; then echo "::error::coverage-perf-cpu support-cost must be false"; exit 1; fi
          if [ -n "$FILTER" ]; then echo "::error::coverage-perf-cpu filter must be empty, the workflow selects its fixed entrypoint"; exit 1; fi
          if [ "$ARTIFACT_ENV" != KE_COVERAGE_PERF_REPORTS ]; then
            echo "::error::coverage-perf-cpu artifact-env must be KE_COVERAGE_PERF_REPORTS"; exit 1
          fi
          if ! [[ "$COVERAGE_PERF_UNIT" =~ ^[a-z0-9-]{1,64}$ ]]; then
            echo "::error::coverage-perf-unit must be 1 to 64 lowercase ASCII letters, digits or hyphens"; exit 1
          fi
          if ! [[ "$COVERAGE_PERF_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::coverage-perf-manifest-sha256 must be exactly 64 lowercase hex characters"; exit 1
          fi
          if ! [[ "$COVERAGE_PERF_WORKLOAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::coverage-perf-workload-sha must be exactly 40 lowercase hex characters"; exit 1
          fi
          case "$COVERAGE_PERF_PRESET" in C0|C1) ;; *) echo "::error::coverage-perf-preset must be C0 or C1"; exit 1 ;; esac

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ runner.arch }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nuget-

      # Game repositories vendor the engine and evict stale versions first. The engine instead needs the
      # local-feed directory its nuget.config names as a source. Each step runs only where it applies.
      - name: Evict stale vendored engine packages
        if: hashFiles('scripts/evict-stale-vendored.sh') != ''
        run: sh scripts/evict-stale-vendored.sh

      - name: Create the local feed nuget.config names
        if: hashFiles('nuget.config') != ''
        run: if grep -q 'local-feed' nuget.config; then mkdir -p local-feed; fi

      - name: Check the inputs
        env:
          PROJECT: ${{ inputs.project }}
          ITERATIONS: ${{ inputs.iterations }}
          LOAD: ${{ inputs.load }}
          CONFIGURATION: ${{ inputs.configuration }}
          SUPPORT_COST: ${{ inputs.support-cost }}
          ARTIFACT_ENV: ${{ inputs.artifact-env }}
        run: |
          case "$CONFIGURATION" in Release|Debug) ;; *) echo "::error::configuration must be Release or Debug"; exit 1 ;; esac
          case "$ITERATIONS" in ''|*[!0-9]*) echo "::error::iterations must be a whole number"; exit 1 ;; esac
          case "$LOAD" in ''|*[!0-9]*) echo "::error::load must be a whole number"; exit 1 ;; esac
          if [ "$ITERATIONS" -lt 1 ] || [ "$ITERATIONS" -gt 200 ]; then echo "::error::iterations must be 1 to 200"; exit 1; fi
          if [ "$LOAD" -gt 16 ]; then echo "::error::load must be 0 to 16"; exit 1; fi
          if [ ! -f "$PROJECT" ]; then echo "::error::project $PROJECT does not exist on this ref"; exit 1; fi
          if [ "$SUPPORT_COST" = true ]; then
            if [ "$CONFIGURATION" != Release ] || [ "$LOAD" -ne 0 ]; then
              echo "::error::support-cost requires Release and load=0"
              exit 1
            fi
            if [ ! -f scripts/record-support-cost-exit.py ]; then
              echo "::error::support-cost requires the caller's scripts/record-support-cost-exit.py"
              exit 1
            fi
          fi
          # The name only ever reaches the test process as one quoted env assignment, never eval or export. It
          # must be a plain identifier, must not be set already, and must not be a shell, process or runner
          # control name, so it cannot redirect PATH, a loader, the runtime or the runner's own files. The
          # rejection never echoes a malformed value, which could otherwise carry a workflow command.
          if [ -n "$ARTIFACT_ENV" ]; then
            case "$ARTIFACT_ENV" in
              [!_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz]*|*[!_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789]*)
                echo "::error::artifact-env must be a shell identifier of ASCII letters, digits and underscores, not starting with a digit"
                exit 1 ;;
            esac
            reserved=false
            case "$(printf '%s' "$ARTIFACT_ENV" | tr abcdefghijklmnopqrstuvwxyz ABCDEFGHIJKLMNOPQRSTUVWXYZ)" in
              PATH|HOME|IFS|CDPATH|ENV|SHELLOPTS|BASHOPTS|SHELL|USER|LOGNAME|PWD|OLDPWD|PS4|GLOBIGNORE|POSIXLY_CORRECT) reserved=true ;;
              TMPDIR|TMP|TEMP|LANG|LANGUAGE|TZ|CI|HTTP_PROXY|HTTPS_PROXY|NO_PROXY|ALL_PROXY) reserved=true ;;
              ARTIFACT_ENV|PROJECT|FILTER|ITERATIONS|LOAD|CONFIGURATION|SUPPORT_COST|BUILD_TARGET|KHAOZ_SUPPORT_COST_ARTIFACT) reserved=true ;;
              BASH_*|GITHUB_*|RUNNER_*|ACTIONS_*|LD_*|DYLD_*|LC_*|DOTNET_*|COMPLUS_*|CORECLR_*|NUGET_*|MSBUILD*|VSTEST*|PYTHON*) reserved=true ;;
            esac
            if [ "$reserved" = true ]; then
              echo "::error::artifact-env $ARTIFACT_ENV is a reserved shell, process or runner name"
              exit 1
            fi
            if declare -p "$ARTIFACT_ENV" > /dev/null 2>&1; then
              echo "::error::artifact-env $ARTIFACT_ENV is already set in the runner environment"
              exit 1
            fi
          fi

      - name: Install coverage software Vulkan
        if: inputs.coverage-perf-cpu
        shell: bash
        run: |
          results="$RUNNER_TEMP/stress"
          mkdir -p "$results"
          # Retain installation failures too, before the test step has created its own log.
          {
            sudo apt-get update
            sudo apt-get install -y libvulkan1 mesa-vulkan-drivers vulkan-tools
            manifests=$(dpkg -L mesa-vulkan-drivers)
            printf '%s\n' "$manifests"
            if ! icd=$(grep -m 1 -E '/lvp_icd[^/]*\.json$' <<< "$manifests") || [ ! -f "$icd" ]; then
              echo "::error::lavapipe ICD manifest not found in the mesa-vulkan-drivers file list"
              exit 1
            fi
            export VK_DRIVER_FILES="$icd" VK_ICD_FILENAMES="$icd"
            { echo "VK_DRIVER_FILES=$icd"; echo "VK_ICD_FILENAMES=$icd"; } >> "$GITHUB_ENV"
            {
              echo "## Coverage CPU software Vulkan environment"
              echo ""
              echo "Backend: vulkan-native, KE_VULKAN_REQUIRED=1, KE_GPU_TESTS=1"
              echo "Adapter policy: lavapipe software Vulkan, CPU preparation evidence only"
              echo "Lavapipe ICD: $icd"
              echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
              echo '```text'
              dpkg-query -W -f='${Package} ${Version}\n' libvulkan1 mesa-vulkan-drivers vulkan-tools
              cat "$icd"
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            # A failed native diagnostic is a setup failure, with its output retained in both places.
            echo '```text' | tee -a "$GITHUB_STEP_SUMMARY"
            vulkaninfo --summary 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' | tee -a "$GITHUB_STEP_SUMMARY"
          } 2>&1 | tee -a "$results/coverage-vulkan-setup.log"

      # The WHOLE solution by default, not just the test project: some suites guard production assemblies the
      # test project does not reference (a Desktop head, an authority scan over the server), and those tests
      # fail outright when only the test project was built.
      - name: Build once
        env:
          PROJECT: ${{ inputs.project }}
          BUILD_TARGET: ${{ inputs.build-target }}
          CONFIGURATION: ${{ inputs.configuration }}
          COVERAGE_PERF_CPU: ${{ inputs.coverage-perf-cpu }}
        run: |
          target="$BUILD_TARGET"
          if [ "$COVERAGE_PERF_CPU" = true ]; then target="$PROJECT"; fi
          if [ -z "$target" ]; then
            set -- $(ls *.slnx *.sln 2>/dev/null)
            if [ "$#" -eq 1 ]; then target="$1"; else target="$PROJECT"; fi
          fi
          if [ ! -e "$target" ]; then echo "::error::build target $target does not exist on this ref"; exit 1; fi
          echo "building $target"
          dotnet build "$target" -c "$CONFIGURATION"

      # A run passes only when dotnet test exits 0 AND the selection executed at least one test: dotnet test
      # exits 0 when a filter matches nothing, so a typo would otherwise report a clean sweep.
      #
      # With artifact-env, each run's test process gets that variable naming its own artifacts/run-N directory,
      # and every log and TRX is kept for the stress-artifacts upload. The step limit then drops to 60 minutes
      # so a timed-out selection still leaves the 90-minute job time to upload what it wrote. That is nominal
      # headroom, not a guarantee that setup, build and the runs fit. Without artifact-env the step keeps the
      # job's 90 minutes, which is today's behaviour. Coverage CPU mode instead caps both the job and run
      # at 20 minutes for validated C0 or 30 for validated C1. Its cooperative unit deadline must leave
      # upload headroom inside that job cap.
      - name: Repeat the selection
        timeout-minutes: ${{ inputs.coverage-perf-cpu && (inputs.coverage-perf-preset == 'C0' && 20 || 30) || (inputs.artifact-env != '' && 60 || 90) }}
        env:
          PROJECT: ${{ inputs.project }}
          FILTER: ${{ inputs.filter }}
          ITERATIONS: ${{ inputs.iterations }}
          LOAD: ${{ inputs.load }}
          CONFIGURATION: ${{ inputs.configuration }}
          SUPPORT_COST: ${{ inputs.support-cost }}
          ARTIFACT_ENV: ${{ inputs.artifact-env }}
          COVERAGE_PERF_CPU: ${{ inputs.coverage-perf-cpu }}
          COVERAGE_PERF_UNIT: ${{ inputs.coverage-perf-unit }}
          COVERAGE_PERF_MANIFEST_SHA256: ${{ inputs.coverage-perf-manifest-sha256 }}
          COVERAGE_PERF_WORKLOAD_SHA: ${{ inputs.coverage-perf-workload-sha }}
        run: |
          results="$RUNNER_TEMP/stress"
          mkdir -p "$results"
          burners=""
          i=0
          while [ "$i" -lt "$LOAD" ]; do
            sh -c 'while :; do :; done' &
            burners="$burners $!"
            i=$((i + 1))
          done
          trap 'for p in $burners; do kill "$p" 2>/dev/null; done' EXIT
          passed=0
          failed=0
          empty=0
          n=1
          while [ "$n" -le "$ITERATIONS" ]; do
            log="$results/run-$n.log"
            trx="$results/run-$n.trx"
            set --
            if [ -n "$ARTIFACT_ENV" ]; then
              run_artifacts="$results/artifacts/run-$n"
              mkdir -p "$run_artifacts"
              set -- env "$ARTIFACT_ENV=$run_artifacts"
              echo "stress-test: run $n $ARTIFACT_ENV=$run_artifacts" > "$log"
            fi
            if [ "$COVERAGE_PERF_CPU" = true ]; then
              FILTER='FullyQualifiedName=EquipmentCoverage.Perf.Tests.CoveragePerfTests.Measure_authorized_unit&Category=CoveragePerformance'
              set -- "$@" "KE_COVERAGE_PERF_UNIT=$COVERAGE_PERF_UNIT" \
                "KE_COVERAGE_PERF_MANIFEST_SHA256=$COVERAGE_PERF_MANIFEST_SHA256" \
                "KE_COVERAGE_PERF_WORKLOAD_SHA=$COVERAGE_PERF_WORKLOAD_SHA" \
                KE_GRAPHICS_BACKEND=vulkan-native KE_VULKAN_REQUIRED=1 KE_GPU_TESTS=1
            fi
            if [ "$SUPPORT_COST" = true ]; then
              export DOTNET_TieredCompilation=0
              export KHAOZ_SUPPORT_COST_ARTIFACT="$results/support-cost/run-$n.json"
            fi
            status=0
            if "$@" dotnet test "$PROJECT" -c "$CONFIGURATION" --no-build --filter "$FILTER" \
                --logger "trx;LogFileName=run-$n.trx" --results-directory "$results" >> "$log" 2>&1; then
              status=0
            else
              status=$?
            fi
            if [ -n "$ARTIFACT_ENV" ]; then echo "stress-test: run $n dotnet test exit $status" >> "$log"; fi
            if [ "$COVERAGE_PERF_CPU" = true ]; then
              if ! python3 - "$trx" "$run_artifacts" "$COVERAGE_PERF_UNIT" >> "$log" 2>&1 <<'PY'
          import json
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          trx, directory, unit = sys.argv[1:]
          try:
              root = ET.parse(trx).getroot()
              counters = root.findall('.//{*}Counters')
              if len(counters) != 1:
                  raise ValueError('TRX must contain exactly one Counters element')
              counts = {key: int(counters[0].attrib[key])
                        for key in ('total', 'executed', 'passed', 'failed', 'notExecuted')}
              if counts != {'total': 1, 'executed': 1, 'passed': 1, 'failed': 0, 'notExecuted': 0}:
                  raise ValueError(f'TRX requires exactly one passed executed test and no skipped or failed tests: {counts}')
              tests = root.findall('.//{*}UnitTestResult')
              if len(tests) != 1 or tests[0].get('outcome') != 'Passed':
                  raise ValueError('TRX must contain exactly one Passed test result')
              report_path = Path(directory) / (unit + '.json')
              document = json.loads(report_path.read_text(encoding='utf-8'))
              if document['schema'] != 'khaozengine.coverage-perf-report/1':
                  raise ValueError('report schema does not match khaozengine.coverage-perf-report/1')
              if document['report']['identity']['unitId'] != unit:
                  raise ValueError('report unit does not match coverage-perf-unit')
              markdown = Path(directory) / (unit + '.md')
              if not markdown.is_file() or markdown.stat().st_size == 0:
                  raise ValueError('Markdown report is missing or empty')
          except (OSError, ValueError, KeyError, TypeError, ET.ParseError) as error:
              print(f'Coverage CPU evidence is unfinalized: {error}', file=sys.stderr)
              sys.exit(1)
          print('Coverage CPU evidence finalized: exactly one passed test, matching JSON and nonempty Markdown')
          PY
              then
                echo "::error::run $n did not produce finalized coverage CPU reports and exactly one passed test"
                status=1
              fi
            fi
            if [ "$SUPPORT_COST" = true ]; then
              if [ ! -s "$KHAOZ_SUPPORT_COST_ARTIFACT" ] || \
                  ! python3 scripts/record-support-cost-exit.py "$KHAOZ_SUPPORT_COST_ARTIFACT" "$status" >> "$log" 2>&1; then
                echo "::error::run $n did not produce a finalized support-cost artifact"
                status=1
              fi
            fi
            if [ "$status" -eq 0 ]; then
              executed=$(grep -o '<Counters [^/]*' "$trx" 2>/dev/null | head -1 | grep -o ' executed="[0-9]*"' | grep -o '[0-9]*')
              if [ "${executed:-0}" -gt 0 ]; then
                passed=$((passed + 1))
                if [ -z "$ARTIFACT_ENV" ]; then rm -f "$log" "$trx"; fi
              else
                empty=$((empty + 1))
                echo "::error::run $n selected no tests"
              fi
            else
              failed=$((failed + 1))
              echo "::error::run $n failed"
              grep -E '\[FAIL\]|Error Message:' -A 3 "$log" | head -40 || true
            fi
            n=$((n + 1))
          done
          {
            echo "## stress-test"
            echo ""
            echo "- project: \`$PROJECT\` ($CONFIGURATION)"
            echo "- filter: \`$FILTER\`"
            echo "- load: $LOAD busy loops"
            echo "- result: $passed passed, $failed failed, $empty selected nothing, of $ITERATIONS runs"
            if [ -n "$ARTIFACT_ENV" ]; then
              echo "- artifacts: \`$ARTIFACT_ENV\` named a directory per run, every log and TRX kept as \`stress-artifacts\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "stress-test: $passed passed, $failed failed, $empty selected nothing, of $ITERATIONS runs"
          test "$failed" -eq 0 && test "$empty" -eq 0

      - name: Upload support cost artifacts
        if: always() && inputs.support-cost
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: support-cost
          path: ${{ runner.temp }}/stress/support-cost
          retention-days: 7
          if-no-files-found: error

      # Artifact mode uploads the whole stress tree whatever the outcome, so the failing-runs upload below
      # stands down rather than upload the same files twice.
      - name: Upload the stress artifacts
        if: always() && inputs.artifact-env != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stress-artifacts
          path: ${{ runner.temp }}/stress
          retention-days: 7
          if-no-files-found: warn

      - name: Upload the failing runs
        if: failure() && inputs.artifact-env == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stress-test-results
          path: ${{ runner.temp }}/stress
          retention-days: 7
          if-no-files-found: ignore
