name: stress-test

# THE shared stress workflow for every APKiwiOrg repository. A repository calls it from a small caller of its own
# (see README.md), so there is one implementation, and every run happens on a GitHub-hosted runner in the
# CALLER's Actions, checking out the caller's ref. Nothing ever runs on the dev Mac or the self-hosted fleet,
# which is the dev Mac.
#
# A load or stress run needs the owner's explicit permission before it starts (shared rule
# no-local-stress-load). Ask first, then dispatch the caller:
#
#   gh workflow run stress-test.yml --ref <branch> \
#     -f project=<Tests project>.csproj -f filter="FullyQualifiedName~<Name>" -f iterations=50 -f load=4
#
# Compare mode is manual dispatch only. Use trusted code from the caller repository for both refs.
#
# Inputs reach the scripts only through env, never by expression interpolation into a run line, so a filter
# holding shell metacharacters cannot inject a command.

on:
  workflow_call:
    inputs:
      project:
        description: Test project to build and run (path to its .csproj)
        required: true
        type: string
      filter:
        description: dotnet test --filter expression selecting the tests to repeat
        required: true
        type: string
      iterations:
        description: How many times to run the selection, 1 to 200
        required: false
        default: '20'
        type: string
      load:
        description: Busy-loop processes kept running during every run to add contention, 0 to 16 (0 is none)
        required: false
        default: '0'
        type: string
      build-target:
        description: Solution or project to build before the runs. Empty builds the caller's single root .slnx or .sln, else the test project
        required: false
        default: ''
        type: string
      configuration:
        description: Build configuration, Release or Debug
        required: false
        default: Release
        type: string
      support-cost:
        description: Record one fixed-compilation support-cost artifact per iteration, requires Release and no load
        required: false
        default: false
        type: boolean
      artifact-env:
        description: Environment variable each run gets naming its own retained directory, empty for none
        required: false
        default: ''
        type: string
      compare-ref:
        description: Second branch, tag or commit of the caller to build and run on the same machine
        required: false
        default: ''
        type: string
    secrets:
      packages-token:
        description: Token for a caller whose nuget.config restores from GitHub Packages (the engine passes GITHUB_TOKEN)
        required: false

permissions:
  contents: read

# One stress run per ref at a time. A second dispatch on the same branch queues rather than cancelling the
# first, because a half-finished proof is worth nothing.
concurrency:
  group: stress-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stress:
    # GitHub-hosted on purpose, never [self-hosted]: the self-hosted fleet is the dev Mac.
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ inputs.compare-ref != '' && 180 || 90 }}
    env:
      GITHUB_PACKAGES_PAT: ${{ secrets.packages-token }}
    steps:
      - name: Check comparison inputs
        if: inputs.compare-ref != ''
        env:
          COMPARE_REF: ${{ inputs.compare-ref }}
        run: |
          results="$RUNNER_TEMP/stress"
          mkdir -p "$results"
          progress="$results/progress.txt"
          {
            printf 'primary ref: %q\n' "$GITHUB_REF"
            printf 'compare ref: %q\n' "$COMPARE_REF"
            printf 'caller event: %s\n' "$GITHUB_EVENT_NAME"
          } > "$progress"
          trap 'printf "comparison validation: exit %s\n" "$?" >> "$progress"' EXIT
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            echo "::error::compare-ref requires a workflow_dispatch caller"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ runner.arch }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nuget-

      # Game repositories vendor the engine and evict stale versions first. The engine instead needs the
      # local-feed directory its nuget.config names as a source. Each step runs only where it applies.
      - name: Evict stale vendored engine packages
        if: hashFiles('scripts/evict-stale-vendored.sh') != ''
        run: sh scripts/evict-stale-vendored.sh

      - name: Create the local feed nuget.config names
        if: hashFiles('nuget.config') != ''
        run: if grep -q 'local-feed' nuget.config; then mkdir -p local-feed; fi

      - name: Check the inputs
        env:
          BUILD_TARGET: ${{ inputs.build-target }}
          COMPARE_REF: ${{ inputs.compare-ref }}
          PROJECT: ${{ inputs.project }}
          ITERATIONS: ${{ inputs.iterations }}
          LOAD: ${{ inputs.load }}
          CONFIGURATION: ${{ inputs.configuration }}
          SUPPORT_COST: ${{ inputs.support-cost }}
          ARTIFACT_ENV: ${{ inputs.artifact-env }}
        run: |
          if [ -n "$COMPARE_REF" ]; then
            progress="$RUNNER_TEMP/stress/progress.txt"
            trap 'printf "input validation: exit %s\n" "$?" >> "$progress"' EXIT
          fi
          case "$CONFIGURATION" in Release|Debug) ;; *) echo "::error::configuration must be Release or Debug"; exit 1 ;; esac
          case "$ITERATIONS" in ''|*[!0-9]*) echo "::error::iterations must be a whole number"; exit 1 ;; esac
          case "$LOAD" in ''|*[!0-9]*) echo "::error::load must be a whole number"; exit 1 ;; esac
          if [ "$ITERATIONS" -lt 1 ] || [ "$ITERATIONS" -gt 200 ]; then echo "::error::iterations must be 1 to 200"; exit 1; fi
          if [ "$LOAD" -gt 16 ]; then echo "::error::load must be 0 to 16"; exit 1; fi
          if [ -n "$COMPARE_REF" ]; then
            # Require one source ref so fetch writes one entry to FETCH_HEAD.
            case "$COMPARE_REF" in
              tag) echo "::error::compare-ref tag requires a fully qualified ref such as refs/heads/tag"; exit 1 ;;
              -*|+*|[[:space:]]*) echo "::error::compare-ref must name a branch, tag or commit"; exit 1 ;;
            esac
            if ! git check-ref-format --allow-onelevel "$COMPARE_REF"; then
              echo "::error::compare-ref must name a branch, tag or commit"
              exit 1
            fi
            if [ "$SUPPORT_COST" = true ]; then
              echo "::error::support-cost cannot be used with compare-ref"
              exit 1
            fi
            for path in "$PROJECT" "$BUILD_TARGET"; do
              case "/$path/" in
                //?*|*/../*) echo "::error::compare-ref requires checkout-relative project and build-target paths"; exit 1 ;;
              esac
            done
          else
            unset COMPARE_REF
          fi
          if [ ! -f "$PROJECT" ]; then echo "::error::project $PROJECT does not exist on this ref"; exit 1; fi
          if [ "$SUPPORT_COST" = true ]; then
            if [ "$CONFIGURATION" != Release ] || [ "$LOAD" -ne 0 ]; then
              echo "::error::support-cost requires Release and load=0"
              exit 1
            fi
            if [ ! -f scripts/record-support-cost-exit.py ]; then
              echo "::error::support-cost requires the caller's scripts/record-support-cost-exit.py"
              exit 1
            fi
          fi
          # The name only ever reaches the test process as one quoted env assignment, never eval or export. It
          # must be a plain identifier, must not be set already, and must not be a shell, process or runner
          # control name, so it cannot redirect PATH, a loader, the runtime or the runner's own files. The
          # rejection never echoes a malformed value, which could otherwise carry a workflow command.
          if [ -n "$ARTIFACT_ENV" ]; then
            case "$ARTIFACT_ENV" in
              [!_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz]*|*[!_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789]*)
                echo "::error::artifact-env must be a shell identifier of ASCII letters, digits and underscores, not starting with a digit"
                exit 1 ;;
            esac
            reserved=false
            case "$(printf '%s' "$ARTIFACT_ENV" | tr abcdefghijklmnopqrstuvwxyz ABCDEFGHIJKLMNOPQRSTUVWXYZ)" in
              PATH|HOME|IFS|CDPATH|ENV|SHELLOPTS|BASHOPTS|SHELL|USER|LOGNAME|PWD|OLDPWD|PS4|GLOBIGNORE|POSIXLY_CORRECT) reserved=true ;;
              TMPDIR|TMP|TEMP|LANG|LANGUAGE|TZ|CI|HTTP_PROXY|HTTPS_PROXY|NO_PROXY|ALL_PROXY) reserved=true ;;
              ARTIFACT_ENV|PROJECT|FILTER|ITERATIONS|LOAD|CONFIGURATION|SUPPORT_COST|BUILD_TARGET|KHAOZ_SUPPORT_COST_ARTIFACT) reserved=true ;;
              BASH_*|GITHUB_*|RUNNER_*|ACTIONS_*|LD_*|DYLD_*|LC_*|DOTNET_*|COMPLUS_*|CORECLR_*|NUGET_*|MSBUILD*|VSTEST*|PYTHON*) reserved=true ;;
            esac
            if [ "$reserved" = true ]; then
              echo "::error::artifact-env $ARTIFACT_ENV is a reserved shell, process or runner name"
              exit 1
            fi
            if declare -p "$ARTIFACT_ENV" > /dev/null 2>&1; then
              echo "::error::artifact-env $ARTIFACT_ENV is already set in the runner environment"
              exit 1
            fi
          fi

      - name: Check out the comparison ref
        if: inputs.compare-ref != ''
        env:
          PROJECT: ${{ inputs.project }}
          COMPARE_REF: ${{ inputs.compare-ref }}
        run: |
          results="$RUNNER_TEMP/stress"
          progress="$results/progress.txt"
          stage='primary commit'
          trap 'printf "%s: exit %s\n" "$stage" "$?" >> "$progress"' EXIT
          primary_commit=$(git rev-parse HEAD)
          printf 'primary commit: %s\n' "$primary_commit" >> "$progress"

          stage=fetch
          if ! git fetch --depth=1 --no-tags --no-recurse-submodules --refmap= -- origin "$COMPARE_REF"; then
            echo "::error::compare-ref could not be fetched from the caller repository"
            exit 1
          fi
          printf 'fetch: exit 0\n' >> "$progress"

          stage=peel
          if ! compare_commit=$(git rev-parse --verify 'FETCH_HEAD^{commit}'); then
            echo "::error::compare-ref must resolve to a commit"
            exit 1
          fi
          printf 'peel: exit 0\ncompare commit: %s\n' "$compare_commit" >> "$progress"

          stage=metadata
          processor_model=''
          if [ -r /proc/cpuinfo ]; then
            processor_model=$(awk -F ': *' '/^model name[[:space:]]*:/ {print $2; exit}' /proc/cpuinfo)
          fi
          {
            printf 'primary\t%s\t%s\n' "$GITHUB_REF" "$primary_commit"
            printf 'compare\t%s\t%s\n' "$COMPARE_REF" "$compare_commit"
            printf 'Processor model: %s\n' "${processor_model:-unknown}"
            printf 'Logical processors: %s\n' "$(getconf _NPROCESSORS_ONLN)"
          } > "$results/refs.txt"

          stage=worktree
          compare_checkout="$RUNNER_TEMP/stress-compare"
          GIT_LFS_SKIP_SMUDGE=1 git worktree add --detach "$compare_checkout" "$compare_commit"
          printf 'worktree: exit 0\n' >> "$progress"

          stage='compare project'
          if [ ! -f "$compare_checkout/$PROJECT" ]; then
            echo "::error::project $PROJECT does not exist on the comparison ref"
            exit 1
          fi

      # The WHOLE solution by default, not just the test project: some suites guard production assemblies the
      # test project does not reference (a Desktop head, an authority scan over the server), and those tests
      # fail outright when only the test project was built.
      - name: Build once
        env:
          PROJECT: ${{ inputs.project }}
          BUILD_TARGET: ${{ inputs.build-target }}
          CONFIGURATION: ${{ inputs.configuration }}
          COMPARE_REF: ${{ inputs.compare-ref }}
        run: |
          export -n COMPARE_REF
          select_target() {
            target="$BUILD_TARGET"
            if [ -z "$target" ]; then
              set -- $(ls *.slnx *.sln 2>/dev/null)
              if [ "$#" -eq 1 ]; then target="$1"; else target="$PROJECT"; fi
            fi
            if [ ! -e "$target" ]; then
              echo "::error::build target $target does not exist on this ref"
              return 1
            fi
          }
          build() {
            echo "building $1"
            dotnet build "$1" -c "$CONFIGURATION"
          }
          if [ -z "$COMPARE_REF" ]; then
            select_target
            build "$target"
            exit
          fi

          # Check both inputs in both trees before either build starts.
          verify_path() {
            local kind="$1" path="$2" root="$3" resolved
            if ! resolved=$(realpath -- "$path"); then
              echo "::error::$kind $path could not be resolved" >&2
              return 1
            fi
            case "$resolved" in
              "$root"|"$root"/*) ;;
              *) echo "::error::$kind $path resolves outside its checkout" >&2; return 1 ;;
            esac
          }
          verify_tree() (
            cd "$1" || exit
            root=$(pwd -P) || exit
            verify_path project "$PROJECT" "$root" || exit
            # This function's output is the target name, so the resolver's diagnostic goes to the error stream here.
            select_target >&2 || exit
            verify_path 'build target' "$target" "$root" || exit
            printf '%s\n' "$target"
          )

          progress="$RUNNER_TEMP/stress/progress.txt"
          compare_checkout="$RUNNER_TEMP/stress-compare"
          stage='primary paths'
          trap 'printf "%s: exit %s\n" "$stage" "$?" >> "$progress"' EXIT
          primary_target=$(verify_tree "$PWD")
          printf 'primary paths: exit 0\n' >> "$progress"
          stage='compare paths'
          compare_target=$(verify_tree "$compare_checkout")
          printf 'compare paths: exit 0\n' >> "$progress"

          stage='primary build'
          printf 'primary build: started\n' >> "$progress"
          build "$primary_target"
          printf 'primary build: exit 0\n' >> "$progress"

          stage='compare build'
          printf 'compare build: started\n' >> "$progress"
          (
            cd "$compare_checkout"
            # A package may have different content under the same version on the two refs.
            export NUGET_PACKAGES="$RUNNER_TEMP/stress-compare-packages"
            if [ -f scripts/evict-stale-vendored.sh ]; then sh scripts/evict-stale-vendored.sh; fi
            if [ -f nuget.config ] && grep -q 'local-feed' nuget.config; then mkdir -p local-feed; fi
            build "$compare_target"
          )

      # A run passes only when dotnet test exits 0 AND the selection executed at least one test: dotnet test
      # exits 0 when a filter matches nothing, so a typo would otherwise report a clean sweep.
      #
      # Compare and artifact modes keep all logs and TRX files. Their step limits leave nominal headroom for
      # uploads after a step timeout. Compare mode gets more time because it runs the selection twice.
      - name: Repeat the selection
        timeout-minutes: ${{ inputs.compare-ref != '' && 150 || (inputs.artifact-env != '' && 60 || 90) }}
        env:
          PROJECT: ${{ inputs.project }}
          FILTER: ${{ inputs.filter }}
          ITERATIONS: ${{ inputs.iterations }}
          LOAD: ${{ inputs.load }}
          CONFIGURATION: ${{ inputs.configuration }}
          SUPPORT_COST: ${{ inputs.support-cost }}
          ARTIFACT_ENV: ${{ inputs.artifact-env }}
          COMPARE_REF: ${{ inputs.compare-ref }}
        run: |
          export -n COMPARE_REF
          results="$RUNNER_TEMP/stress"
          mkdir -p "$results"
          result_dirs=("$results")
          labels=("")
          if [ -n "$COMPARE_REF" ]; then
            compare_checkout="$RUNNER_TEMP/stress-compare"
            result_dirs=("$results/primary" "$results/compare")
            labels=("primary " "compare ")
            mkdir -p "${result_dirs[@]}"
            primary_commit=$(git rev-parse HEAD)
            compare_commit=$(git -C "$compare_checkout" rev-parse HEAD)
          fi

          passed=(0 0)
          failed=(0 0)
          empty=(0 0)
          run_selection() {
            local side="$1" results="${result_dirs[$1]}" label="${labels[$1]}"
            local log="$results/run-$n.log" trx="$results/run-$n.trx"
            local run_artifacts status executed
            local assignments=()
            if [ "$side" -eq 1 ]; then
              assignments+=("GITHUB_SHA=$compare_commit" "NUGET_PACKAGES=$RUNNER_TEMP/stress-compare-packages")
            fi
            if [ -n "$ARTIFACT_ENV" ]; then
              run_artifacts="$results/artifacts/run-$n"
              mkdir -p "$run_artifacts"
              assignments+=("$ARTIFACT_ENV=$run_artifacts")
              echo "stress-test: run $n $ARTIFACT_ENV=$run_artifacts" > "$log"
            fi
            set --
            if [ "${#assignments[@]}" -gt 0 ]; then set -- env "${assignments[@]}"; fi
            if [ "$SUPPORT_COST" = true ]; then
              export DOTNET_TieredCompilation=0
              export KHAOZ_SUPPORT_COST_ARTIFACT="$results/support-cost/run-$n.json"
            fi
            if (
              if [ "$side" -eq 1 ]; then cd "$compare_checkout" || exit; fi
              "$@" dotnet test "$PROJECT" -c "$CONFIGURATION" --no-build --filter "$FILTER" \
                --logger "trx;LogFileName=run-$n.trx" --results-directory "$results"
            ) >> "$log" 2>&1; then
              status=0
            else
              status=$?
            fi
            if [ -n "$ARTIFACT_ENV" ]; then echo "stress-test: run $n dotnet test exit $status" >> "$log"; fi
            if [ "$SUPPORT_COST" = true ]; then
              if [ ! -s "$KHAOZ_SUPPORT_COST_ARTIFACT" ] || \
                  ! python3 scripts/record-support-cost-exit.py "$KHAOZ_SUPPORT_COST_ARTIFACT" "$status" >> "$log" 2>&1; then
                echo "::error::run $n did not produce a finalized support-cost artifact"
                status=1
              fi
            fi
            if [ "$status" -eq 0 ]; then
              # A missing or unreadable TRX finds no count, which is an empty selection. The || true keeps the
              # failed grep from ending the whole step under the runner's bash -e.
              executed=$(grep -o '<Counters [^/]*' "$trx" 2>/dev/null | head -1 | grep -o ' executed="[0-9]*"' | grep -o '[0-9]*' || true)
              if [ "${executed:-0}" -gt 0 ]; then
                passed[side]=$((passed[side] + 1))
                if [ -z "$ARTIFACT_ENV" ] && [ -z "$COMPARE_REF" ]; then rm -f "$log" "$trx"; fi
              else
                empty[side]=$((empty[side] + 1))
                echo "::error::${label}run $n selected no tests"
              fi
            else
              failed[side]=$((failed[side] + 1))
              echo "::error::${label}run $n failed"
              grep -E '\[FAIL\]|Error Message:' -A 3 "$log" | head -40 || true
            fi
          }

          burners=""
          i=0
          while [ "$i" -lt "$LOAD" ]; do
            sh -c 'while :; do :; done' &
            burners="$burners $!"
            i=$((i + 1))
          done
          trap 'for p in $burners; do kill "$p" 2>/dev/null; done' EXIT
          n=1
          while [ "$n" -le "$ITERATIONS" ]; do
            if [ -n "$COMPARE_REF" ] && [ $((n % 2)) -eq 0 ]; then
              run_selection 1
              run_selection 0
            else
              run_selection 0
              if [ -n "$COMPARE_REF" ]; then run_selection 1; fi
            fi
            n=$((n + 1))
          done

          result() {
            local side="$1"
            echo "${passed[side]} passed, ${failed[side]} failed, ${empty[side]} selected nothing, of $ITERATIONS runs"
          }
          literal_ref() {
            local value="$1" fence='`'
            while [[ "$value" == *"$fence"* ]]; do fence+='`'; done
            printf '%s %s %s' "$fence" "$value" "$fence"
          }
          {
            echo "## stress-test"
            echo ""
            echo "- project: \`$PROJECT\` ($CONFIGURATION)"
            echo "- filter: \`$FILTER\`"
            echo "- load: $LOAD busy loops"
            if [ -n "$COMPARE_REF" ]; then
              echo "- primary: $(literal_ref "$GITHUB_REF") (\`$primary_commit\`), $(result 0)"
              echo "- compare: $(literal_ref "$COMPARE_REF") (\`$compare_commit\`), $(result 1)"
            else
              echo "- result: $(result 0)"
              if [ -n "$ARTIFACT_ENV" ]; then
                echo "- artifacts: \`$ARTIFACT_ENV\` named a directory per run, every log and TRX kept as \`stress-artifacts\`"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$COMPARE_REF" ]; then
            echo "stress-test primary: $(result 0)"
            echo "stress-test compare: $(result 1)"
          else
            echo "stress-test: $(result 0)"
          fi
          test "$((failed[0] + failed[1] + empty[0] + empty[1]))" -eq 0

      - name: Upload the stress comparison
        if: always() && inputs.compare-ref != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stress-compare
          path: ${{ runner.temp }}/stress
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true

      - name: Upload support cost artifacts
        if: always() && inputs.compare-ref == '' && inputs.support-cost
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: support-cost
          path: ${{ runner.temp }}/stress/support-cost
          retention-days: 7
          if-no-files-found: error

      # Artifact mode uploads the whole stress tree whatever the outcome, so the failing-runs upload below
      # stands down rather than upload the same files twice.
      - name: Upload the stress artifacts
        if: always() && inputs.compare-ref == '' && inputs.artifact-env != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stress-artifacts
          path: ${{ runner.temp }}/stress
          retention-days: 7
          if-no-files-found: warn

      - name: Upload the failing runs
        if: failure() && inputs.compare-ref == '' && inputs.artifact-env == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stress-test-results
          path: ${{ runner.temp }}/stress
          retention-days: 7
          if-no-files-found: ignore
