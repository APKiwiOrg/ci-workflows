name: check

# Keeps every workflow in this public repository hosted and SHA-pinned, parses them, and runs the stress
# workflow's shell steps against a stub dotnet.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workflows:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Hosted and pinned
        run: sh scripts/check-workflows.sh
      - name: Every workflow parses
        run: for f in .github/workflows/*.yml; do python3 -c "import sys,yaml; yaml.safe_load(open(sys.argv[1]))" "$f" || exit 1; done
      - name: Stress workflow shell steps
        run: sh scripts/tests/stress-test-workflow.test.sh
