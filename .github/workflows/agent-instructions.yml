name: agent-instructions
on:
  push:
    paths:
      - 'AGENTS.md'
      - 'AGENTS.override.md'
      - 'CLAUDE.md'
      - 'scripts/check-agent-instructions.sh'
      - 'scripts/tests/check-agent-instructions.test.sh'
      - '.github/workflows/agent-instructions.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'AGENTS.override.md'
      - 'CLAUDE.md'
      - 'scripts/check-agent-instructions.sh'
      - 'scripts/tests/check-agent-instructions.test.sh'
      - '.github/workflows/agent-instructions.yml'
permissions:
  contents: read
jobs:
  instruction-budget:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sh scripts/check-agent-instructions.sh --tree
      - run: sh scripts/tests/check-agent-instructions.test.sh
