name: site-ci

# The shared CI for every site. A site calls it from a small caller of its own (see README.md) named CI in
# .github/workflows/ci.yml, whose successful main-push runs are what site-deploy.yml accepts.
#
# Config validation gates every job. The site capabilities select the theme, analytics and SQL checks.
# The api steps run when the checkout has an api directory. Infrastructure and e2e are required.
#
# Inputs reach scripts only through env, never by expression interpolation into a run line.

on:
  workflow_call:
    inputs:
      node-version-file:
        description: File naming the Node version jobs after config validation install
        required: false
        default: .nvmrc
        type: string
      analytics-test-token:
        description: Fixture Cloudflare Web Analytics token for cloudflare builds and tests
        required: false
        default: '00000000000000000000000000000000'
        type: string
      bicep-file:
        description: Bicep template the infra job compiles
        required: false
        default: infra/main.bicep
        type: string

permissions: {}

jobs:
  config:
    name: Validate site config
    uses: ./.github/workflows/site-config.yml
    permissions:
      contents: read

  checks:
    needs: config
    name: Lint, typecheck, test and build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      - name: npm install policy
        run: node scripts/check-npm-policy.mjs

      - name: Install
        run: npm ci

      # Before lint, because the api files are linted with their own types.
      - name: Install api
        run: |
          if [ -d api ]; then
            npm ci --prefix api
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck api
        run: |
          if [ -d api ]; then
            npm run typecheck --prefix api
          fi

      - name: Test
        env:
          VITE_CLOUDFLARE_ANALYTICS_TOKEN: ${{ needs.config.outputs.analytics == 'cloudflare' && inputs.analytics-test-token || '' }}
        run: npm test

      - name: Test api
        run: |
          if [ -d api ]; then
            npm test --prefix api
          fi

      - name: Theme conventions
        if: needs.config.outputs.has-theme == 'true'
        run: npm run check:theme

      - name: Build
        if: needs.config.outputs.analytics == 'none'
        run: npm run build

      # Browser fixtures intercept telemetry locally. Use only the fixture token in CI.
      - name: Build with analytics
        if: needs.config.outputs.analytics == 'cloudflare'
        env:
          VITE_CLOUDFLARE_ANALYTICS_TOKEN: ${{ inputs.analytics-test-token }}
        run: npm run build

      - name: Asset budget
        env:
          APP_LOCATION: ${{ needs.config.outputs.app-location }}
        run: |
          node --input-type=module <<'NODE'
          import { realpathSync } from 'node:fs'
          import { resolve, sep } from 'node:path'
          import { spawnSync } from 'node:child_process'
          const checkout = realpathSync(process.cwd())
          function inside(path) {
            if (!path.startsWith(`${checkout}${sep}`)) {
              console.error(`Asset path resolves outside checkout: ${process.env.APP_LOCATION}`)
              process.exit(1)
            }
            return path
          }
          const path = inside(realpathSync(inside(resolve(checkout, process.env.APP_LOCATION))))
          const result = spawnSync(process.execPath, ['scripts/check-assets.mjs', path], { stdio: 'inherit' })
          if (result.error) console.error(result.error.message)
          process.exit(result.status ?? 1)
          NODE

  sql:
    needs: config
    if: needs.config.outputs.has-accounts == 'true'
    name: SQL integration tests
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      - name: npm install policy
        run: node scripts/check-npm-policy.mjs

      - name: Install api
        run: npm ci --prefix api

      - name: Start SQL Server
        run: |
          set -eu
          sql_password="$(openssl rand -hex 24)"
          sql_password="Sql1!$sql_password"
          echo "::add-mask::$sql_password"
          export MSSQL_SA_PASSWORD="$sql_password"
          # Pin the stored OCI manifest because MCR's converted Docker v2 digest cannot be pulled by digest.
          docker run -d --name accounts-sql -p 127.0.0.1:1433:1433 \
            --env ACCEPT_EULA=Y --env MSSQL_SA_PASSWORD \
            mcr.microsoft.com/mssql/server@sha256:4525e3efac9f3e241cb003bb2ff2a82818b502f37e12049d788b1a9fa7e13b7f # 2022-latest
          for attempt in $(seq 1 30); do
            if SQLCMDPASSWORD="$sql_password" docker exec --env SQLCMDPASSWORD accounts-sql \
              /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -l 2 -t 2 -Q 'SELECT 1' > /dev/null 2>&1; then
              printf 'ACCOUNTS_SQL_TEST_SERVER=Server=127.0.0.1,1433;User Id=sa;Password=%s;Encrypt=true;TrustServerCertificate=true\n' "$sql_password" >> "$GITHUB_ENV"
              exit 0
            fi
            if [ "$attempt" -lt 30 ]; then
              sleep 2
            fi
          done
          echo 'SQL Server did not become ready after 30 login attempts.' >&2
          exit 1

      # Blob integration tests run against the storage emulator. Only the blob service runs. The storage
      # SDK can send a newer API version than the emulator knows, so the version check is off.
      - name: Start Azurite
        run: |
          set -eu
          # MCR stores this image as a Docker v2 manifest list, and that served digest pulls by digest.
          azurite_image=mcr.microsoft.com/azure-storage/azurite@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5 # 3.37.0
          docker run -d --name media-blob -p 127.0.0.1:10000:10000 "$azurite_image" \
            azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck
          # Any HTTP status means the blob endpoint answers. curl prints 000 when nothing answers.
          for attempt in $(seq 1 30); do
            code="$(curl -s --max-time 2 -o /dev/null -w '%{http_code}' http://127.0.0.1:10000/devstoreaccount1 || true)"
            if [ "$code" != 000 ]; then
              exit 0
            fi
            if [ "$attempt" -lt 30 ]; then
              sleep 2
            fi
          done
          echo 'Azurite did not answer on 127.0.0.1:10000 after 30 attempts.' >&2
          exit 1

      # UseDevelopmentStorage=true is the storage SDK's emulator shorthand, so no emulator key is written here.
      - name: SQL integration tests
        env:
          ACCOUNTS_SQL_TEST_SERVER: ${{ env.ACCOUNTS_SQL_TEST_SERVER }}
          MEDIA_BLOB_TEST_CONNECTION: UseDevelopmentStorage=true
        run: npm run test:sql --prefix api

  repo:
    needs: config
    name: Repository conventions
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}

      - name: Dashes
        run: sh scripts/check-dashes.sh --tree

      - name: Prose
        run: sh scripts/check-prose.sh --tree

      - name: Scratch docs
        run: sh scripts/check-scratch.sh --tree

      - name: Agent instruction budget
        run: sh scripts/check-agent-instructions.sh --tree

      # A site made from APKiwiOrg/site-template carries site-template.lock.json and the checker that
      # hashes its template-managed files against it. A repository with no lock is not a template site.
      - name: Site template drift
        run: |
          if [ -f site-template.lock.json ]; then
            node scripts/check-site-template.mjs
          else
            echo "Site template drift: no site-template.lock.json, skipping"
          fi

      - name: Script tests
        run: |
          set -eu
          for test in scripts/tests/*.test.sh; do
            sh "$test"
          done

  e2e:
    needs: [config, checks]
    name: End-to-end smoke
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      - name: npm install policy
        run: node scripts/check-npm-policy.mjs

      - name: Install
        run: npm ci

      - name: Build
        if: needs.config.outputs.analytics == 'none'
        run: npm run build

      # Browser fixtures intercept telemetry locally. Use only the fixture token in CI.
      - name: Build with analytics
        if: needs.config.outputs.analytics == 'cloudflare'
        env:
          VITE_CLOUDFLARE_ANALYTICS_TOKEN: ${{ inputs.analytics-test-token }}
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        env:
          VITE_CLOUDFLARE_ANALYTICS_TOKEN: ${{ needs.config.outputs.analytics == 'cloudflare' && inputs.analytics-test-token || '' }}
        run: npm run test:e2e

  secrets:
    needs: config
    name: Secret scan
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      # From the release's gitleaks_8.30.1_checksums.txt. Update both together.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Secret scan (gitleaks, every commit)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner --verbose .
          rm gitleaks gitleaks.tar.gz

  infra:
    needs: config
    name: Compile Bicep
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}

      - name: Build template
        env:
          BICEP_FILE: ${{ inputs.bicep-file }}
        run: |
          mkdir -p /tmp/site-infra
          chmod 0700 /tmp/site-infra
          node --input-type=module <<'NODE'
          import { realpathSync } from 'node:fs'
          import { resolve, sep } from 'node:path'
          import { spawnSync } from 'node:child_process'
          const checkout = realpathSync(process.cwd())
          function inside(path) {
            if (!path.startsWith(`${checkout}${sep}`)) {
              console.error(`Infrastructure template path resolves outside checkout: ${process.env.BICEP_FILE}`)
              process.exit(1)
            }
            return path
          }
          const path = inside(realpathSync(inside(resolve(checkout, process.env.BICEP_FILE))))
          const result = spawnSync('az', ['bicep', 'build', '--file', path, '--outfile', '/tmp/site-infra/main.json'], { stdio: 'inherit' })
          if (result.error) console.error(result.error.message)
          process.exit(result.status ?? 1)
          NODE

      - name: Build parameters
        env:
          INFRA_PARAMS: ${{ needs.config.outputs.infra-params }}
        run: |
          umask 077
          node --input-type=module <<'NODE'
          import { existsSync, realpathSync, statSync } from 'node:fs'
          import { resolve, sep } from 'node:path'
          import { spawnSync } from 'node:child_process'
          const params = JSON.parse(process.env.INFRA_PARAMS)
          const checkout = realpathSync(process.cwd())
          function inside(path, source) {
            if (!path.startsWith(`${checkout}${sep}`)) {
              console.error(`Infrastructure params path resolves outside checkout: ${source}`)
              process.exit(1)
            }
            return path
          }
          const resolved = params.map((path) => {
            const absolute = inside(resolve(checkout, path), path)
            if (!existsSync(absolute) || !statSync(absolute).isFile()) {
              console.error(`Missing infrastructure params file: ${path}`)
              process.exit(1)
            }
            return inside(realpathSync(absolute), path)
          })
          for (const [index, path] of params.entries()) {
            const output = `/tmp/site-infra/params-${index}.json`
            const result = spawnSync('az', ['bicep', 'build-params', '--file', resolved[index], '--outfile', output], {
              stdio: 'inherit',
            })
            if (result.error) console.error(result.error.message)
            if (result.status !== 0) {
              console.error(`Infrastructure params compilation failed: ${path}`)
              process.exit(result.status ?? 1)
            }
          }
          NODE

      - name: Infrastructure policy
        env:
          INFRA_PARAMS: ${{ needs.config.outputs.infra-params }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import { spawnSync } from 'node:child_process'
          const params = JSON.parse(process.env.INFRA_PARAMS)
          for (const [index, path] of params.entries()) {
            const compiledPath = `/tmp/site-infra/params-${index}.json`
            try {
              const parameters = JSON.parse(readFileSync(compiledPath, 'utf8'))?.parameters
              if (parameters === null || typeof parameters !== 'object' || Array.isArray(parameters)) {
                throw new Error('Expected a parameters object.')
              }
            } catch (error) {
              console.error(`Invalid compiled infrastructure params file ${compiledPath} for ${path}`)
              console.error(error.message)
              process.exit(1)
            }
            const result = spawnSync(process.execPath, ['scripts/check-infra.mjs', '/tmp/site-infra/main.json', compiledPath], {
              stdio: 'inherit',
            })
            if (result.error) console.error(result.error.message)
            if (result.status !== 0) {
              console.error(`Infrastructure policy failed for params file: ${path}`)
              process.exit(result.status ?? 1)
            }
          }
          NODE

  audit:
    name: Dependency audit
    needs: config
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      - name: npm install policy
        run: node scripts/check-npm-policy.mjs

      - name: Install and audit
        run: |
          npm ci
          npm audit --audit-level=high
          if [ -d api ]; then
            npm ci --prefix api
            npm audit --audit-level=high --prefix api
          fi
