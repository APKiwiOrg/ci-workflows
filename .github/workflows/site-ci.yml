name: site-ci

# The shared CI for every site. A site calls it from a small caller of its own (see README.md) named CI in
# .github/workflows/ci.yml, whose successful main-push runs are what site-deploy.yml accepts.
#
# Config validation gates every job. The site capabilities select the theme and analytics checks.
# The api steps run when the checkout has an api directory. Infrastructure and e2e are required.
#
# Inputs reach scripts only through env, never by expression interpolation into a run line.

on:
  workflow_call:
    inputs:
      node-version-file:
        description: File naming the Node version jobs after config validation install
        required: false
        default: .nvmrc
        type: string
      analytics-test-token:
        description: Fixture Cloudflare Web Analytics token for cloudflare builds and tests
        required: false
        default: '00000000000000000000000000000000'
        type: string
      bicep-file:
        description: Bicep template the infra job compiles
        required: false
        default: infra/main.bicep
        type: string

permissions: {}

jobs:
  config:
    name: Validate site config
    uses: ./.github/workflows/site-config.yml
    permissions:
      contents: read

  checks:
    needs: config
    name: Lint, typecheck, test and build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      - name: npm install policy
        run: node scripts/check-npm-policy.mjs

      - name: Install
        run: npm ci

      # Before lint, because the api files are linted with their own types.
      - name: Install api
        run: |
          if [ -d api ]; then
            npm ci --prefix api
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck api
        run: |
          if [ -d api ]; then
            npm run typecheck --prefix api
          fi

      - name: Test
        env:
          VITE_CLOUDFLARE_ANALYTICS_TOKEN: ${{ needs.config.outputs.analytics == 'cloudflare' && inputs.analytics-test-token || '' }}
        run: npm test

      - name: Test api
        run: |
          if [ -d api ]; then
            npm test --prefix api
          fi

      - name: Theme conventions
        if: needs.config.outputs.has-theme == 'true'
        run: npm run check:theme

      - name: Build
        if: needs.config.outputs.analytics == 'none'
        run: npm run build

      # Browser fixtures intercept telemetry locally. Use only the fixture token in CI.
      - name: Build with analytics
        if: needs.config.outputs.analytics == 'cloudflare'
        env:
          VITE_CLOUDFLARE_ANALYTICS_TOKEN: ${{ inputs.analytics-test-token }}
        run: npm run build

      - name: Asset budget
        env:
          APP_LOCATION: ${{ needs.config.outputs.app-location }}
        run: node scripts/check-assets.mjs "$APP_LOCATION"

  repo:
    needs: config
    name: Repository conventions
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}

      - name: Dashes
        run: sh scripts/check-dashes.sh --tree

      - name: Prose
        run: sh scripts/check-prose.sh --tree

      - name: Scratch docs
        run: sh scripts/check-scratch.sh --tree

      - name: Agent instruction budget
        run: sh scripts/check-agent-instructions.sh --tree

      # A site made from APKiwiOrg/site-template carries site-template.lock.json and the checker that
      # hashes its template-managed files against it. A repository with no lock is not a template site.
      - name: Site template drift
        run: |
          if [ -f site-template.lock.json ]; then
            node scripts/check-site-template.mjs
          else
            echo "Site template drift: no site-template.lock.json, skipping"
          fi

      - name: Script tests
        run: |
          set -eu
          for test in scripts/tests/*.test.sh; do
            sh "$test"
          done

  e2e:
    needs: [config, checks]
    name: End-to-end smoke
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      - name: npm install policy
        run: node scripts/check-npm-policy.mjs

      - name: Install
        run: npm ci

      - name: Build
        if: needs.config.outputs.analytics == 'none'
        run: npm run build

      # Browser fixtures intercept telemetry locally. Use only the fixture token in CI.
      - name: Build with analytics
        if: needs.config.outputs.analytics == 'cloudflare'
        env:
          VITE_CLOUDFLARE_ANALYTICS_TOKEN: ${{ inputs.analytics-test-token }}
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        env:
          VITE_CLOUDFLARE_ANALYTICS_TOKEN: ${{ needs.config.outputs.analytics == 'cloudflare' && inputs.analytics-test-token || '' }}
        run: npm run test:e2e

  secrets:
    needs: config
    name: Secret scan
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      # From the release's gitleaks_8.30.1_checksums.txt. Update both together.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Secret scan (gitleaks, every commit)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner --verbose .
          rm gitleaks gitleaks.tar.gz

  infra:
    needs: config
    name: Compile Bicep
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}

      - name: Build template
        env:
          BICEP_FILE: ${{ inputs.bicep-file }}
        run: |
          mkdir -p /tmp/site-infra
          chmod 0700 /tmp/site-infra
          az bicep build --file "$BICEP_FILE" --outfile /tmp/site-infra/main.json

      - name: Build parameters
        env:
          INFRA_PARAMS: ${{ needs.config.outputs.infra-params }}
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, statSync } from 'node:fs'
          import { spawnSync } from 'node:child_process'
          const params = JSON.parse(process.env.INFRA_PARAMS)
          for (const path of params) {
            if (!existsSync(path) || !statSync(path).isFile()) {
              console.error(`Missing infrastructure params file: ${path}`)
              process.exit(1)
            }
          }
          for (const path of params) {
            const result = spawnSync('az', ['bicep', 'build-params', '--file', path, '--stdout'], {
              stdio: ['ignore', 'ignore', 'inherit'],
            })
            if (result.error) console.error(result.error.message)
            if (result.status !== 0) process.exit(result.status ?? 1)
          }
          NODE

      - name: Infrastructure policy
        run: node scripts/check-infra.mjs /tmp/site-infra/main.json

  audit:
    name: Dependency audit
    needs: config
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      - name: npm install policy
        run: node scripts/check-npm-policy.mjs

      - name: Install and audit
        run: |
          npm ci
          npm audit --audit-level=high
          if [ -d api ]; then
            npm ci --prefix api
            npm audit --audit-level=high --prefix api
          fi
