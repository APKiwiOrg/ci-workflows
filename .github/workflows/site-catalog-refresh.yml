name: site-catalog-refresh

# The caller owns the schedule. Redispatch its existing deploy workflow with the published source SHA.
on:
  workflow_call:
    inputs:
      enabled:
        description: Refresh only when true. Callers pass vars.AZURE_ENABLED == 'true'
        required: false
        default: false
        type: boolean
      site-origin:
        description: The site's bare credential-free https origin, empty to skip. Callers pass vars.SITE_ORIGIN
        required: false
        default: ''
        type: string

permissions: {}

jobs:
  refresh:
    name: Refresh the catalog
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch catalog refresh
        env:
          ENABLED: ${{ inputs.enabled }}
          SITE_ORIGIN: ${{ inputs.site-origin }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ "$ENABLED" != "true" ] || [ -z "$SITE_ORIGIN" ]; then
            echo "::notice::Catalog refresh skipped. Enable deployment and set the SITE_ORIGIN repository variable to run it."
            exit 0
          fi

          if ! snapshot_origin=$(node --input-type=module -e '
            const input = process.env.SITE_ORIGIN
            // Check the supplied form before URL parsing can normalize it.
            const bareHttps = /^https:\/\/(?:\[[a-f0-9:.]+\]|[^:\/?#@\\[\]\s\p{Cc}]+)(?::[0-9]+)?\/?$/iu
            const url = bareHttps.test(input) ? URL.parse(input) : null
            if (!url) process.exit(1)
            console.log(url.origin)
          '); then
            echo "::error::SITE_ORIGIN must be the site's https origin with no credentials, query, fragment or path beyond /." >&2
            exit 1
          fi

          snapshot_file=$(mktemp)
          trap 'rm -f "$snapshot_file"' EXIT
          status=$(curl --disable --silent --show-error --max-time 30 --globoff \
            --output "$snapshot_file" --write-out '%{http_code}' -- "$snapshot_origin/_catalog/snapshot.json")
          if [ "$status" != "200" ]; then
            echo "::error::Catalog snapshot request returned HTTP $status. Expected HTTP 200 from SITE_ORIGIN." >&2
            exit 1
          fi

          # Validate the decoded string before command substitution can strip trailing newlines.
          if ! live_sha=$(jq -ers '
            select(length == 1)
            | .[0].deployedSha
            | select(type == "string" and test("\\A[a-f0-9]{40}\\z"))
          ' "$snapshot_file"); then
            echo "::error::Catalog refresh requires a published snapshot with a full lowercase deployedSha." >&2
            exit 1
          fi

          # Every deploy.yml run shares deploy-main, so the newest run normally waits behind an
          # active deploy. The 100-run page leaves room for cancellations and startup failures.
          # One API round trip remains between lookup and dispatch. The guard rechecks the live
          # SHA inside deploy-main and skips the refresh if another run moved it.
          active_deploys=$(gh api --method GET "repos/$GH_REPO/actions/workflows/deploy.yml/runs" \
            -f per_page=100 --jq '[.workflow_runs[] | select(.status != "completed")] | length')
          if [ "$active_deploys" != "0" ]; then
            echo "::notice::Catalog refresh skipped because a deployment is active."
            exit 0
          fi
          gh workflow run deploy.yml --ref main -f sha="$live_sha" -f refresh=true
